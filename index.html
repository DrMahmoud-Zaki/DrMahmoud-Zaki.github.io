<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Mahmoud Zaki | Cement Production Specialist</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: Arial, Helvetica, sans-serif; background: #0b0f14; color: #f4f4f4; line-height: 1.6; }
        a { color: inherit; text-decoration: none; }
        .container { width: min(1120px, 90%); margin: auto; }

        /* Navigation */
        nav { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background: rgba(11, 15, 20, 0.92); border-bottom: 1px solid #252b33; backdrop-filter: blur(10px); }
        .nav-inner { min-height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .nav-logo { max-height: 60px; width: auto; object-fit: contain; } /* تم زيادة حجم الشعار */

        /* Hero */
        .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 60px; } /* تم تقليل المسافة العلوية */
        .hero-grid { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 60px; align-items: center; }
        .eyebrow { color: #d6a84f; font-size: 14px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px; }
        
        h1 { font-size: clamp(30px, 5vw, 60px); line-height: 1.1; margin-bottom: 24px; white-space: nowrap; } /* تم جعل الاسم في سطر واحد */
        .hero h1 span { color: #d6a84f; }
        
        .hero-buttons { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 13px 22px; border-radius: 6px; font-weight: 700; font-size: 14px; transition: 0.3s; cursor: pointer; }
        .btn-primary { background: #d6a84f; color: #0b0f14; }
        .btn-secondary { border: 1px solid #3a424c; color: #f4f4f4; }
        .btn-secondary:hover { border-color: #d6a84f; color: #d6a84f; }

        .hero-image { width: 100%; max-width: 400px; border-radius: 14px; box-shadow: 0 25px 60px rgba(0,0,0,0.35); }
        
        /* Contact */
        .contact-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .contact-item { border: 1px solid #29313a; padding: 25px; border-radius: 10px; background: #11171e; }
        
        @media (max-width: 800px) {
            .hero-grid { grid-template-columns: 1fr; text-align: center; }
            h1 { white-space: normal; }
        }
    </style>
</head>
<body>

<nav>
    <div class="container nav-inner">
        <div class="logo">
            <!-- تم نقل الشعار ليكون ظاهراً بوضوح -->
            <img src="logo.jpeg" alt="Logo" class="nav-logo">
        </div>
        <ul class="nav-links" style="display:flex; list-style:none; gap:20px;">
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#experience">Experience</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>
</nav>

<section class="hero">
    <div class="container hero-grid">
        <div>
            <div class="eyebrow">Cement Industry Professional</div>
            <h1>Dr. <span>Mahmoud Zaki</span></h1>
            <div class="hero-title">Senior Production Shift Leader</div>
            <p class="hero-text">Cement process optimization, alternative fuels, and energy efficiency.</p>
            
            <div class="hero-buttons">
                <a class="btn btn-secondary" href="Mahmoud_Zaki_CV.pdf" download>Download CV</a>
                <a class="btn btn-primary" href="https://www.linkedin.com/in/mahmoud-zaki-cement" target="_blank">LinkedIn Profile</a>
            </div>
        </div>
        <div>
            <img src="me2.png" alt="Dr. Mahmoud Zaki" class="hero-image">
        </div>
    </div>
</section>

<!-- بقية الأقسام كما هي -->
<section id="contact">
    <div class="container">
        <h2 class="section-title">Get in Touch</h2>
        <div class="contact-box">
            <div class="contact-item">
                <strong>Email</strong>
                <span>M.ZAKI.KHETABI@GMAIL.COM</span>
            </div>
            <div class="contact-item">
                <strong>Phone</strong>
                <a href="tel:01002580455" class="btn btn-primary">Call: 01002580455</a>
            </div>
        </div>
    </div>
</section>

</body>
</html>
